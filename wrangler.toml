name = "webhook-alert"
main = "worker/index.js"
compatibility_date = "2024-09-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "webhook-alert"
database_id = "4e1aad23-f52c-4e57-bf1a-9612f2743d52"

# 메일 발송 대체 경로. RESEND_API_KEY 가 없으면 이 바인딩으로 보낸다.
# 수신 주소가 Cloudflare Email Routing 에 인증돼 있어야 한다.
[[send_email]]
name = "EMAIL"

[vars]
FIREBASE_PROJECT_ID = "webhook-alert-system"
ALLOWED_EMAILS = "totoriverce@gmail.com,qa@muhayu.com,bae@sanghak.kr"
ALLOWED_ORIGINS = "https://webhook.sanghak.kr,http://localhost:5173"
MAIL_FROM = "웹훅 알림 <alerts@sanghak.kr>"
# 모든 알림이 가는 유일한 주소. 규칙에 무엇이 적혀 있든 여기로만 보낸다.
MAIL_TO = "bae@sanghak.kr"
EVENT_RETENTION_DAYS = "30"

# 시크릿 (wrangler secret put 으로 설정)
#   RESEND_API_KEY
